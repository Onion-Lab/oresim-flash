# nginx 설정 예: public/ 의 내용을 /var/www/oresim/ 에 올려 https://oresim.example.com/ (도메인 맨 위)으로 내보낸다.
# 쓰는 법: 이 파일을 /etc/nginx/sites-available/oresim 같은 곳에 복사해 도메인·경로·인증서를 고치고, 켠 뒤 nginx -t && systemctl reload nginx.
# 설명은 README.md 의 '웹에 올리기'. 이미 그 도메인의 server 블록이 있으면 location 세 개만 옮겨 넣는다.
#
# 하위 경로(https://example.com/oresim/)로 낼 때: root 를 /var/www 로, location 의 / 를 /oresim/ 으로 바꾼다
# (location ~ ^/oresim/.+\.(?:css|js|svg)$ 처럼). 주소가 모두 상대경로라 어느 경로에 두어도 된다.

server {
    # (가) 이 서버가 HTTPS 를 직접 받을 때(Let's Encrypt 인증서, 또는 Cloudflare 프록시 + 원 서버 인증서)
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     /etc/letsencrypt/live/oresim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oresim.example.com/privkey.pem;
    # (나) Cloudflare Tunnel 뒤: 위 네 줄 대신 이 컴퓨터 안에서만 듣는다(cloudflared 가 http://127.0.0.1:8080 으로 넘겨 준다)
    # listen 127.0.0.1:8080;

    server_name oresim.example.com;
    root /var/www/oresim;
    charset utf-8;               # index.html 등의 문자 코드를 UTF-8 로 알린다(페이지에 한국어가 그대로 있다)
    absolute_redirect off;       # 폴더 주소의 / 넘김을 상대 주소로(프록시·터널 뒤에서 내부 주소와 포트가 붙지 않게)

    location / {
        index index.html;
        add_header Cache-Control "no-cache";                               # index.html: 매번 확인(바뀌지 않았으면 304)
    }
    location ~ \.(?:css|js|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";    # index.html 이 ?v= 판 번호를 붙여 부르는 파일
    }
    location ~ \.(?:png|mp3)$ {
        add_header Cache-Control "public, max-age=86400";                  # 판 번호가 없는 그림·효과음: 하루
    }
    location ~ /\.(?!well-known/) {
        return 404;                                                        # .htaccess 같은 점 파일은 내보내지 않는다(인증서 발급용 .well-known 은 둔다)
    }
}

# (가) 일 때 http:// 로 온 요청을 https:// 로 넘긴다
server {
    listen 80;
    listen [::]:80;
    server_name oresim.example.com;
    return 301 https://$host$request_uri;
}
